# Install as /etc/salt/minion.d/schedule.conf
#
# Runs inside the minion daemon itself on the given interval -- no external
# cron/systemd process spawning a fresh salt-call each time. When the job
# finishes, the minion calls the zabbix_status returner (see
# salt/_returners/zabbix_status.py), which writes the status file
# salt_check.sh reads.

schedule:
  highstate:
    function: state.highstate
    minutes: 30
    returner: zabbix_status
    splay: 60   # stagger start across minions if you have many, avoid caching herd
