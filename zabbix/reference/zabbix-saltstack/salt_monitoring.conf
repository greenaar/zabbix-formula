# Install as /etc/zabbix/zabbix_agent2.d/plugins.d/salt_monitoring.conf
# (or /etc/zabbix/zabbix_agentd.d/salt_monitoring.conf on Agent 1)
#
# Single master item: returns one JSON document per call. The Zabbix
# template turns this into individual metrics via dependent items with
# JSONPath preprocessing, so Zabbix only has to invoke this script once per
# polling interval instead of once per metric.

UserParameter=salt.check,sudo /etc/zabbix/scripts/salt_check.sh
